# Builds Zenlo-Setup.exe on GitHub's own machines when a version tag (v0.1.0, …) is pushed,
# checks it, has it signed by SignPath (once the project is set up there), attests where it was
# built from, and publishes it with its SHA-256. Also packs the extension for Zalo web,
# Zenlo-ZaloWeb.zip, which people load by hand into their browser.
# Anyone can then check that a download was built from this repository:
#   gh attestation verify Zenlo-Setup.exe --repo <owner>/<repo>
#
# Code signing (SignPath Foundation, https://signpath.org): the signing steps run only when the
# repository variable SIGNPATH_ORGANIZATION_ID is set. They also need the variables
# SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG and
# the secret SIGNPATH_API_TOKEN. Every signing request waits for a manual approval in SignPath.
#
# Two jobs: "build" installs packages and builds with read-only access; only "publish", which runs
# no project code, may write the release and the attestation.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read      # check out the code
      actions: read       # let SignPath read this run's artifact
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # A tag that does not match package.json would publish the app under the wrong version (the
      # app compares its own version with the latest release to offer updates)
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in package.json ($version)."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npx standard

      # Link checking, the digest split, the transcript: no AI, no network
      - name: Unit tests
        run: node test/unit/run.mjs

      - name: Build Zenlo-Setup.exe
        run: npm run build:setup

      - name: Check the embedded files
        run: build/setup/Zenlo-Setup.exe --check

      # ---------- Code signing (SignPath) ----------

      - name: Upload the unsigned build for signing
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zenlo-Setup-unsigned
          path: build/setup/Zenlo-Setup.exe
          if-no-files-found: error

      - name: Sign with SignPath (waits for manual approval)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # The approver may take a while; the job itself stops after 6 hours
          wait-for-completion-timeout-in-seconds: 20000
          output-artifact-directory: build/signed

      - name: Use the signed build
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature build/signed/Zenlo-Setup.exe
          if ($signature.Status -ne 'Valid') { throw "The signed file is not valid: $($signature.Status) $($signature.StatusMessage)" }
          Copy-Item build/signed/Zenlo-Setup.exe build/setup/Zenlo-Setup.exe -Force
          # The SHA-256 of the file people download, so after signing
          $hash = (Get-FileHash build/setup/Zenlo-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("build/setup/SHA256.txt", "$hash  Zenlo-Setup.exe`n")
          build/setup/Zenlo-Setup.exe --check

      # Browsers warn far less about a zip than an exe while downloading
      - name: Pack Zenlo-Setup.zip
        shell: pwsh
        run: Compress-Archive -Path build/setup/Zenlo-Setup.exe -DestinationPath build/setup/Zenlo-Setup.zip -Force

      # The extension for Zalo web (dist-ext/, built by "npm run build:setup" above), with its
      # SHA-256 added to the same SHA256.txt. Nothing to sign: a browser checks no signature on a
      # folder loaded by hand.
      - name: Pack Zenlo-ZaloWeb.zip
        shell: bash
        run: |
          node scripts/pack-ext.mjs
          cp build/ext/Zenlo-ZaloWeb.zip build/setup/
          cat build/ext/SHA256.txt >> build/setup/SHA256.txt

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            build/setup/Zenlo-Setup.exe
            build/setup/Zenlo-Setup.zip
            build/setup/Zenlo-ZaloWeb.zip
            build/setup/SHA256.txt
          if-no-files-found: error

  # ---------- Publish ----------

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: build/setup

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/setup/Zenlo-Setup.exe
            build/setup/Zenlo-Setup.zip
            build/setup/Zenlo-ZaloWeb.zip

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(grep ' Zenlo-Setup.exe$' build/setup/SHA256.txt | cut -d' ' -f1)
          ext_hash=$(grep ' Zenlo-ZaloWeb.zip$' build/setup/SHA256.txt | cut -d' ' -f1)
          if [ -z "$hash" ] || [ -z "$ext_hash" ]; then
            echo "::error::SHA256.txt does not list both Zenlo-Setup.exe and Zenlo-ZaloWeb.zip."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" build/setup/Zenlo-Setup.zip build/setup/Zenlo-Setup.exe build/setup/Zenlo-ZaloWeb.zip build/setup/SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zenlo $GITHUB_REF_NAME" \
            --notes "SHA-256 của Zenlo-Setup.exe: \`$hash\`
          Zenlo-Setup.zip chứa đúng file Zenlo-Setup.exe này.

          SHA-256 của Zenlo-ZaloWeb.zip (Zenlo cho Zalo web): \`$ext_hash\`

          Kiểm tra file tải về: \`Get-FileHash .\\Zenlo-Setup.exe -Algorithm SHA256\`
          Kiểm tra nguồn gốc build: \`gh attestation verify .\\Zenlo-Setup.exe --repo $GITHUB_REPOSITORY\`

          Code signing policy: https://zenlo.io.vn/ky-so.html"
