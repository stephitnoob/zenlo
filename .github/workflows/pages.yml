# Publishes the website in site/ to GitHub Pages whenever it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Pages and their scripts and stylesheets are cached separately by browsers. Links carry
      # "?v=dev" in the repository; the published copy gets this commit's id instead, so a new
      # page never runs with an old cached script.
      - name: Stamp asset links with the commit
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/*.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
